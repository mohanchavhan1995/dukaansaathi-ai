<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DukaanSaathi AI - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 390px;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; color: #14532d; margin-bottom: 5px; }
    .sub { text-align: center; color: #64748b; margin-bottom: 25px; }
    input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #1e293b; }
    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      color: #b45309;
      overflow-wrap: anywhere;
    }
    .note { font-size: 12px; color: #64748b; text-align: center; margin-top: 18px; }
    .link-btn { background: transparent; color: #15803d; text-decoration: underline; padding: 8px; margin-top: 6px; font-size: 14px; }
    #newPassword { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛍️ DukaanSaathi AI</h1>
    <p class="sub">तुमच्या दुकानाचा डिजिटल साथीदार</p>

    <input id="email" type="email" placeholder="तुमचा Email" required>
    <input id="password" type="password" placeholder="Password (किमान 6 अक्षरे)" required>

    <button id="signup">नवीन खाते तयार करा</button>
    <button id="login" class="secondary">Login करा</button>
    <button id="forgotPassword" class="link-btn" type="button">Password विसरलात? Forgot Password</button>
    <input id="newPassword" type="password" placeholder="नवीन Password (किमान 6 अक्षरे)" minlength="6">
    <button id="saveNewPassword" style="display:none" type="button">नवीन Password सेव्ह करा</button>

    <p id="message"></p>
    <p class="note">खाते तयार केल्यावर Email Verification करावे लागू शकते.</p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // इथे तुमचा Supabase Project URL आणि Publishable key भरा.
    const SUPABASE_URL = "https://fdvwpvprsvozvliqotmt.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Zg_NMelV2LvGDCAqM4rbvw_CmNpCK-u";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const newPasswordInput = document.getElementById("newPassword");
    const saveNewPasswordButton = document.getElementById("saveNewPassword");

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        newPasswordInput.style.display = "block";
        saveNewPasswordButton.style.display = "block";
        message.textContent = "नवीन Password टाका.";
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", async () => {
      const email = emailInput.value.trim();
      if (!email) {
        message.textContent = "आधी तुमचा Registered Email भरा.";
        emailInput.focus();
        return;
      }
      message.textContent = "Password Reset लिंक पाठवत आहोत...";
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      message.textContent = error
        ? error.message
        : "Password Reset लिंक तुमच्या Email वर पाठवली आहे. Email उघडून लिंकवर क्लिक करा.";
    });

    saveNewPasswordButton.addEventListener("click", async () => {
      const newPassword = newPasswordInput.value;
      if (newPassword.length < 6) {
        message.textContent = "नवीन Password किमान 6 अक्षरांचा असावा.";
        return;
      }
      message.textContent = "नवीन Password सेव्ह होत आहे...";
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) {
        message.textContent = error.message;
      } else {
        message.textContent = "Password यशस्वीरीत्या बदलला! आता नवीन Password ने Login करा.";
        newPasswordInput.value = "";
        newPasswordInput.style.display = "none";
        saveNewPasswordButton.style.display = "none";
        await supabase.auth.signOut();
      }
    });

    document.getElementById("signup").addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || password.length < 6) {
        message.textContent = "योग्य Email आणि किमान 6 अक्षरांचा Password भरा.";
        return;
      }

      message.textContent = "खाते तयार होत आहे...";

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.href
        }
      });

      if (error) {
        message.textContent = error.message;
      } else if (data.session) {
        message.textContent = "खाते तयार झाले! आता Login करत आहोत...";
        window.location.href = "./index.html";
      } else {
        message.textContent =
          "खाते तयार झाले! तुमचा Email उघडा आणि Verification लिंकवर क्लिक करा.";
      }
    });

    document.getElementById("login").addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.textContent = "Email आणि Password भरा.";
        return;
      }

      message.textContent = "Login होत आहे...";

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
      } else {
        message.textContent = "Login यशस्वी!";
        window.location.href = "./index.html";
      }
    });
  </script>
</body>
</html>
